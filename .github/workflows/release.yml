name: Release NoirGlass

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify tag belongs to main
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          RELEASE_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:all
      - name: Verify reproducible release assets
        shell: bash
        run: |
          sha256sum dist/noirglass.min.css dist/noirglass.companion.js dist/NoirGlass.Plugin_12.1.0.zip manifest.json > "$RUNNER_TEMP/noirglass-checksums"
          npm run build:all
          sha256sum --check "$RUNNER_TEMP/noirglass-checksums"
      - run: npm run check
      - run: npm run test:docs
      - run: npm run test:plugin
      - run: npm run test:companion
      - run: npm run test:autoplay
      - run: npm run test:home-options
      - run: npm run test:responsive
      - run: npm run test:formats
      - run: npm run test:plugin-settings
      - run: npm run test:branding
      - run: npm run test:ui
      - run: npm run test:dashboard
      - run: npm run test:dashboard-layout
      - run: npm run test:login
      - run: npm run test:desktop
      - run: npm run test:polish
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: noirglass-ui-fixtures
          if-no-files-found: ignore
          path: |
            test-results/ui/
            test-results/dashboard-layout/
            test-results/polish/
            test-results/responsive/
            test-results/desktop/
      - run: npm run test:release
      - name: Verify release versions and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Verify tagged CSS, browser payload and documentation
        shell: bash
        run: |
          git ls-files --error-unmatch README.md docs/CUSTOMIZATION.md dist/noirglass.min.css dist/noirglass.companion.js
          git diff --exit-code -- README.md docs/CUSTOMIZATION.md dist/noirglass.min.css dist/noirglass.companion.js
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: noirglass-release
          if-no-files-found: error
          path: |
            dist/noirglass.min.css
            dist/NoirGlass.Plugin_12.1.0.zip
            manifest.json

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: noirglass-release
          path: release-files
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-files/dist/noirglass.min.css \
            release-files/dist/NoirGlass.Plugin_12.1.0.zip \
            release-files/manifest.json \
            --verify-tag --notes-file release-notes.md --title "NoirGlass ${RELEASE_TAG#v}"
